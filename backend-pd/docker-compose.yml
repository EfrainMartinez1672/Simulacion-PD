services:
  db:
    image: postgres:16-alpine
    container_name: simulacion-pd-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-simulacion_pd}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-simulacion_pd}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simulacion-pd-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-simulacion_pd}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      DB_SSL: ${DB_SSL:-false}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run start:dev"

volumes:
  postgres_data:
