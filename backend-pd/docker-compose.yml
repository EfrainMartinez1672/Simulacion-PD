services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simulacion-pd-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/requests.sqlite
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - sqlite_data:/app/data

volumes:
  sqlite_data:
